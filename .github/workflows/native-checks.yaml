on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run native-checks.yaml --ref main`.
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the three workflows it changes: quick skips the asan
# containers, valgrind and cran-special. lto, rchk and analyzers take minutes
# either way and run on every push. gctorture has its own caller,
# gctorture.yml, with step 20 on a schedule.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: auto

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: auto
      # A cli thread's TLS reads as "possibly lost"; see the file.
      suppressions: tools/valgrind.supp

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1

  # -fanalyzer over the CRoaring amalgamation takes about 15 minutes, three
  # times the quick budget, so pull requests run it only with the full-ci
  # label; every push to main and every full run still does. Findings in
  # vendored CRoaring are listed apart, since they are upstream's.
  analyzers:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      exclude: |
        src/croaring/

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: auto
