on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: vendor-upstream

# Weekly: opens or updates one issue when CRoaring has released a version
# newer than the one pinned in vendor.yaml. Never fails the check.
jobs:
  upstream:
    uses: pedrobtz/r-actions/.github/workflows/vendor-upstream.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1 (v1.30.0)
    permissions:
      contents: read
      issues: write
    with:
      upstream-repo: RoaringBitmap/CRoaring
      current-version: "sed -n 's/^  tag: //p' vendor.yaml"
