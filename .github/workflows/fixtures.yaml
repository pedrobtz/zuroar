on:
  pull_request:
    paths:
      - "tools/fixtures/**"
      - "tests/testthat/fixtures/**"
      - ".github/workflows/fixtures.yaml"
  workflow_dispatch:

name: fixtures

permissions:
  contents: read

# Development only (design §8): regenerates the interoperability fixtures
# with pyroaring and Java's RoaringBitmap and fails if any byte differs
# from what is committed, so the fixtures stay reproducible.
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Regenerate
        run: tools/fixtures/make-fixtures
      - name: Compare with the committed fixtures
        run: git diff --exit-code --stat -- tests/testthat/fixtures
