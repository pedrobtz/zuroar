on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@4062705ecc3560e85ec8045b30d0e9951fa447a2 # v1 (v1.30.0)
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
    permissions:
      contents: write
